<div class="div-table">

  <table class="table">
    <thead>
      <tr>
        <th></th>
        <th scope="col">Nom</th>
        <th scope="col">Email</th>
        <th scope="col">Phone</th>
        <th scope="col">Adresse</th>
        <th scope="col"><button id="btnOpenCreateForm" (click)="openCreateForm()">Créer </button></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cli of liste" (click)="select(cli.id)">
        <td>
          <input class="form-check-input" type="radio" (click)="select(cli.id)" [checked]="clientSelect==cli.id"
            id="radio{{cli.id}}" />
        </td>
        <td><a href="edit-client/{{cli.id}}"> {{ cli['nom'] }} {{ cli.prenom }} </a> </td>
        <td> {{ cli.email }} </td>
        <td> {{ cli.phone }} </td>
        <td> {{ cli.adresse }} </td>
      </tr>

    </tbody>
  </table>
  <button class="btn btn-light" (click)="select_submit()">Choisir</button>

  <div class="resultat" *ngIf="resultat=='chargement'" >
      Selection du client avec succès ✅
  </div>


</div>
